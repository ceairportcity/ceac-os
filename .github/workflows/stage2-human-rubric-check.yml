name: CEAC Stage 2 reviewed human appraisal integration
on:
  push:
    branches:
      - chatgpt/stage2-quarterly-human-rubric-20261016
    paths:
      - .github/workflows/stage2-human-rubric-check.yml
permissions:
  contents: read
jobs:
  reviewed-human-appraisal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Full exact-HEAD native source and contract verification
        run: npm run verify:source
      - name: Stage 2 Vite build without deploying
        run: npm run build
      - uses: ./.github/actions/setup-ceac-test-environment
      - name: Isolated migration replay and existing rollback-only authority tests
        run: bash scripts/ci/run-sql-security-gates.sh
