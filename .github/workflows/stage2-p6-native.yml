name: CEAC Stage 2 P6 factual reports native verification
on:
  push:
    branches:
      - chatgpt/stage2-p6-reporting-integration-20261016
    paths:
      - .github/workflows/stage2-p6-native.yml
permissions:
  contents: read
jobs:
  verified-reporting:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run build
