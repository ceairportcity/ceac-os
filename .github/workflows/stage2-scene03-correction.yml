name: CEAC Stage 2 image 03 corrective stock photograph
on:
  push:
    branches:
      - chatgpt/stage2-owner-approved-projects-photo-routines-20261016
    paths:
      - .github/workflows/stage2-scene03-correction.yml
permissions:
  contents: write
jobs:
  fix-photo:
    if: github.repository == 'ceairportcity/ceac-os'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Crop genuine CC0 lake photograph and update integrity manifest
        run: python scripts/assets/replace-scene03.py
      - name: Commit only corrected image, catalog and manifest on development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ceac-landscapes/scene-03.webp public/assets/ceac-landscapes/manifest.json src/lib/ceacLandscapeCatalog.js scripts/assets/ceac-landscapes-curated.json
          git diff --cached --quiet && exit 0
          git commit -m "assets(stage2): correct scene 03 to genuine CC0 scenic lake [skip ci]"
          git push origin HEAD:chatgpt/stage2-owner-approved-projects-photo-routines-20261016
