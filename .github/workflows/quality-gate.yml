name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify verification level
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      level_b: ${{ steps.classify.outputs.level_b }}
      run_security_contracts: ${{ steps.classify.outputs.run_security_contracts }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify visual fidelity source of truth
        run: node scripts/ci/check-visual-fidelity-contract.mjs

      - name: Classify exact-head change
        id: classify
        env:
          VERIFICATION_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFICATION_EVENT_NAME: ${{ github.event_name }}
          VERIFICATION_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: node scripts/ci/classify-verification.mjs

  documentation-integrity:
    name: Documentation contract
    needs: classify
    if: needs.classify.outputs.documentation_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify documentation-only checkpoint
        env:
          VERIFICATION_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/check-documentation.mjs

  security-contracts:
    name: Level B SQL and authority contracts
    needs: classify
    if: needs.classify.outputs.run_security_contracts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run Telegram provider unit tests
        run: node --test tests/integration-runtime.test.mjs

      - uses: ./.github/actions/setup-ceac-test-environment

      - name: Run complete SQL, RLS and security contract suite
        run: bash scripts/ci/run-sql-security-gates.sh

  browser-shard:
    name: Level B browser shard ${{ matrix.shard }}/8
    needs: classify
    if: needs.classify.outputs.level_b == 'true'
    # Match the supported OS of pinned Playwright 1.56.1; latest may roll forward.
    runs-on: ubuntu-24.04
    # A full late visual-inventory shard reached test 87/100 before the former
    # 25-minute cap killed its evidence; allow only 10 more minutes, retaining
    # identical tests, isolation, eight shards and fail-fast=false.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      # Each isolated shard still replays schema and role fixtures; split the
      # same complete suite into smaller pieces to avoid the previous 25-min
      # job cancellation without suppressing any tests or weakening failure.
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-ceac-test-environment

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.55.0

      - name: Install Playwright runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ceac-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ceac-vite.log
          exit 1

      - name: Run Playwright role smoke tests
        run: npx playwright test --shard=${{ matrix.shard }}/8 --workers=1

      - name: Upload shard evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-gate-browser-shard-${{ matrix.shard }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  evidence:
    name: Merge exact-head product evidence
    needs: [classify, browser-shard]
    if: needs.classify.outputs.level_b == 'true' && needs.browser-shard.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download all browser-shard evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: quality-gate-browser-shard-*
          path: test-artifacts
          merge-multiple: true

      - name: Upload Stage 6 product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage6-product-inspection
          path: test-artifacts/stage6-workload-*.png
          if-no-files-found: ignore

      - name: Upload Stage 7 product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage7-product-inspection
          path: test-artifacts/stage7-performance-*.png
          if-no-files-found: ignore

      - name: Upload Stage 8 product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage8-product-inspection
          path: test-artifacts/stage8-learning-*.png
          if-no-files-found: ignore

      - name: Upload Stage 9 product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage9-product-inspection
          path: test-artifacts/stage9-workforce-*.png
          if-no-files-found: ignore

      - name: Upload Phase 2 attendance inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase2-attendance-inspection
          path: test-artifacts/phase2-attendance-*.png
          if-no-files-found: error

      - name: Upload Stage 10 product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage10-product-inspection
          path: test-artifacts/stage10-assets-*.png
          if-no-files-found: ignore

      - name: Upload Stage 11 product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage11-product-inspection
          path: test-artifacts/stage11-compliance-*.png
          if-no-files-found: ignore

      - name: Upload Stage 12 Connected Apps inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage12-connected-apps-inspection
          path: test-artifacts/stage12-connected-apps-*.png
          if-no-files-found: ignore

      - name: Upload laptop density inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: laptop-density-inspection
          path: test-artifacts/laptop-density-*.png
          if-no-files-found: ignore

      - name: Upload selective UX primitive inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selective-ux-primitives
          path: test-artifacts/selective-ux-*.png
          if-no-files-found: ignore

      - name: Upload Experience V2 foundation inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: experience-v2-foundation
          path: test-artifacts/ev2-foundation-*.png
          if-no-files-found: ignore

      - name: Upload R0 premium redesign product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r0-product-inspection
          path: test-artifacts/redesign-r0-*.png
          if-no-files-found: ignore

      - name: Upload R1 Staff product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r1-product-inspection
          path: test-artifacts/redesign-r1-*.png
          if-no-files-found: ignore

      - name: Upload R2 Manager product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r2-product-inspection
          path: test-artifacts/redesign-r2-*.png
          if-no-files-found: ignore

      - name: Upload R3 Administration product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r3-product-inspection
          path: test-artifacts/redesign-r3-*.png
          if-no-files-found: ignore

      - name: Upload R4 Executive product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r4-product-inspection
          path: test-artifacts/redesign-r4-*.png
          if-no-files-found: ignore

      - name: Upload R5 Communication product inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r5-product-inspection
          path: test-artifacts/redesign-r5-*.png
          if-no-files-found: ignore

      - name: Upload R6 whole-system consistency inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r6-product-inspection
          path: test-artifacts/redesign-r6-*.png
          if-no-files-found: ignore

      - name: Upload R7 closure inspection
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: redesign-r7-product-inspection
          path: test-artifacts/redesign-r7-*.png
          if-no-files-found: ignore

      - name: Upload full visual parity inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-parity-all-pages
          path: test-artifacts/visual-parity-*.png
          if-no-files-found: ignore

  role-and-rls:
    name: role-and-rls
    needs:
      - classify
      - documentation-integrity
      - security-contracts
      - browser-shard
      - evidence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify requested gate completed
        env:
          DOCUMENTATION_ONLY: ${{ needs.classify.outputs.documentation_only }}
          LEVEL_B: ${{ needs.classify.outputs.level_b }}
          SECURITY_REQUIRED: ${{ needs.classify.outputs.run_security_contracts }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-integrity.result }}
          SECURITY_RESULT: ${{ needs.security-contracts.result }}
          BROWSER_RESULT: ${{ needs.browser-shard.result }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
        run: |
          # Explicit Level B acceptance must never be superseded by a
          # documentation-only diff classification. Fail closed when its
          # SQL, browser, or inspection-evidence jobs have not passed.
          if [[ "$LEVEL_B" == "true" ]]; then
            [[ "$SECURITY_RESULT" == "success" ]]
            [[ "$BROWSER_RESULT" == "success" ]]
            [[ "$EVIDENCE_RESULT" == "success" ]]
            echo "Level B complete acceptance gate passed."
          elif [[ "$SECURITY_REQUIRED" == "true" ]]; then
            # Interim P2 source checks are NOT full browser/P8 acceptance.
            [[ "$SECURITY_RESULT" == "success" ]]
            echo "Focused Edge SQL/authority checks passed; browser/P8 not run."
          elif [[ "$DOCUMENTATION_ONLY" == "true" ]]; then
            [[ "$DOCUMENTATION_RESULT" == "success" ]]
            echo "Documentation-only integrity gate passed."
          else
            echo "Level B was not requested for this implementation commit; CI Level A is authoritative."
          fi
