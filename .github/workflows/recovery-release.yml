name: CEAC Recovery Release

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact protected-main SHA already accepted for production
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pinned v4
        with:
          ref: ${{ inputs.accepted_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm exact checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ inputs.accepted_sha }}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # pinned v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run resilience:verify
      - run: npm run recovery:release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # pinned v7.0.2
        with:
          name: ceac-recovery-${{ inputs.accepted_sha }}
          path: recovery-output/*.tar.gz
          if-no-files-found: error
          retention-days: 30
