name: CEAC Stage 2 exact-head retest after source contract repairs
on:
  push:
    branches:
      - chatgpt/stage2-integrated-qa-contract-20261016
    paths:
      - .github/workflows/stage2-focus-native.yml
permissions:
  contents: read
jobs:
  source-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Exact-HEAD full native source tests
        run: npm run verify:source
      - name: Stage 2 Vite production build (no deployment)
        run: npm run build
# Checkpoint: corrected Stage 1 compatibility tests and integrated Executive Projects path.
# Stage 2 source/build acceptance for new real Work routines and project milestones.
