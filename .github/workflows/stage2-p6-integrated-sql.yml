name: CEAC Stage 2 P6 integrated source and isolated appraisal RLS
on:
  push:
    branches:
      - chatgpt/stage2-p6-reporting-integration-20261016
    paths:
      - .github/workflows/stage2-p6-integrated-sql.yml
permissions:
  contents: read
jobs:
  report-and-auth-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run build
      - uses: ./.github/actions/setup-ceac-test-environment
      - name: Rehearse existing plus Stage 2 P6 migrations and RLS/quarterly HR release negatives in disposable local Supabase
        run: bash scripts/ci/run-sql-security-gates.sh
# Recheck after native source pass and repaired Vite reporting-component syntax.
