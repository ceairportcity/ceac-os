name: CEAC Stage 2 unified source, build and isolated security acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/stage2-unified-integration-20261016
    paths:
      - .github/workflows/stage2-unified-acceptance.yml
      - supabase/tests/platform_kernel_gate.sql
      - supabase/tests/experience_stage6_finance_gate.sql
      - supabase/migrations/20261016210000_154_stage2_universal_rpc_auth_gate.sql
      - supabase/tests/stage2_universal_totp_all_roles_gate.sql
      - tests/stage2SharedPersonalSession.test.mjs
      - tests/technical-support-source-contract.test.mjs
      - src/components/EmployeeWorkSession.jsx
      - src/experience-v2/manager-overview/ManagerOverviewV2.jsx
      - src/experience-v2/admin-overview/AdminOverviewV2.jsx
      - src/experience-v2/executive-overview/ExecutiveOverviewV2.jsx
      - src/screens/ExecutiveHome.jsx
      - package.json
permissions:
  contents: read
jobs:
  unified-source-sql:
    if: github.repository == 'ceairportcity/ceac-os'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Complete native source-level regression
        run: npm run verify:source
      - name: Exact-code Vite production bundle (no deployment)
        run: npm run build
      - name: Start disposable local Supabase fixture only
        uses: ./.github/actions/setup-ceac-test-environment
      - name: Complete forward-only migration replay and SQL/RLS security gates
        run: bash scripts/ci/run-sql-security-gates.sh
