name: CEAC Stage 2 real local TOTP and AAL2 acceptance
on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/stage2-unified-integration-20261016
    paths:
      - .github/workflows/stage2-local-totp-acceptance.yml
      - .github/actions/setup-ceac-test-environment/action.yml
      - scripts/ci/test-stage2-all-role-totp-local.mjs
      - scripts/ci/test-local-totp-aal2.mjs
      - scripts/ci/prepare-local-totp-mfa.mjs
      - tests/account-mfa-local-only.spec.js
      - src/lib/Stage2UniversalMfaPolicy.js
      - src/components/Stage2UniversalMfaGate.jsx
      - src/components/AccountMfaSetup.jsx
      - tests/stage2UniversalMfaPolicy.test.js
      - supabase/functions/integration-runtime/index.ts
      - supabase/functions/integration-runtime/mfa.mjs
      - tests/integration-runtime.test.mjs
permissions:
  contents: read
jobs:
  isolated-real-provider:
    if: github.repository == 'ceairportcity/ceac-os'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start disposable Supabase with local-only authenticator enabled
        uses: ./.github/actions/setup-ceac-test-environment
        with:
          enable_local_totp: 'true'
      - name: Prove real provider AAL1 to verified authenticator AAL2
        run: node scripts/ci/test-local-totp-aal2.mjs
      - name: Install isolated browser runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local-only CEAC UI
        run: |
          VITE_STAGE2_UNIVERSAL_AAL2=true npm run dev -- --host 127.0.0.1 > /tmp/ceac-local-mfa-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ceac-local-mfa-vite.log
          exit 1
      - name: "Verify universal TOTP gate: wrong code, backup factor, refresh and fresh device"
        env:
          CEAC_LOCAL_TOTP_UI: '1'
        run: npx playwright test tests/account-mfa-local-only.spec.js --workers=1
      - name: Start disposable integration Edge function with explicit in-function Auth checks
        run: |
          # The local function checks each real user bearer itself. This
          # no-verify-jwt gateway bypass is isolated to loopback CI ONLY.
          supabase functions serve integration-runtime --no-verify-jwt > /tmp/ceac-isolated-edge.log 2>&1 &
          for i in {1..50}; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -X POST --data '{"action":"health.telegram"}' \
              http://127.0.0.1:54321/functions/v1/integration-runtime || true)
            if [[ "$code" == "401" ]]; then exit 0; fi
            sleep 1
          done
          tail -n 80 /tmp/ceac-isolated-edge.log
          exit 1
      - name: Verify all fixture roles, genuine Edge/Auth/AAL2, Storage and recovery boundaries
        env:
          CEAC_LOCAL_EDGE_URL: http://127.0.0.1:54321/functions/v1/integration-runtime
        run: node scripts/ci/test-stage2-all-role-totp-local.mjs
      - name: Upload local-only browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-real-local-totp-evidence
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7
