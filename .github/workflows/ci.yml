name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      documentation_only: ${{ steps.classify.outputs.documentation_only }}
      level_b: ${{ steps.classify.outputs.level_b }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify GitHub Actions supply-chain policy
        run: node scripts/ci/check-github-actions-pinning.mjs

      - name: Verify visual fidelity source of truth
        run: node scripts/ci/check-visual-fidelity-contract.mjs

      - name: Classify verification scope
        id: classify
        env:
          VERIFICATION_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VERIFICATION_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/classify-verification.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.classify.outputs.documentation_only != 'true'
        with:
          node-version: 22
          cache: npm

      - name: Check documentation integrity
        if: steps.classify.outputs.documentation_only == 'true'
        env:
          VERIFICATION_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
          VERIFICATION_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/check-documentation.mjs

      - name: Install dependencies
        if: steps.classify.outputs.documentation_only != 'true'
        run: npm ci
      - name: Run Telegram provider unit tests
        if: steps.classify.outputs.documentation_only != 'true'
        run: node --test tests/integration-runtime.test.mjs tests/onboarding-foundation.test.mjs tests/attendance.test.mjs tests/mfa-foundation.test.mjs tests/technical-support-v1.test.mjs tests/technical-support-source-contract.test.mjs tests/report-rpc-tenant-scope-contract.test.mjs tests/capability-schema-compatibility.test.mjs tests/pending-feature-compatibility.test.mjs tests/release-runner-target-contract.test.mjs tests/executive-progress-contract.test.mjs tests/admin-premium-source-contract.test.mjs
      - name: Run complete registered application source suite
        if: steps.classify.outputs.documentation_only != 'true'
        run: npm run verify:source

      - name: Validate focused Stage 2 CI classification and release safety
        if: steps.classify.outputs.documentation_only != 'true'
        run: node --test tests/stage2P1ConnectedDesignContract.test.mjs tests/p1DesignPreviewScope.test.mjs tests/p2EdgeScope.test.mjs tests/stage2FocusedScope.test.mjs

      - name: Dependency security audit
        if: steps.classify.outputs.documentation_only != 'true'
        run: npm audit --audit-level=high
      - name: Check changed lines
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff --check "HEAD^...HEAD"
          fi
      - name: Build
        if: steps.classify.outputs.documentation_only != 'true'
        run: npm run build

  targeted-browser:
    name: Level A targeted browser
    needs: build
    if: needs.build.outputs.documentation_only != 'true' && needs.build.outputs.level_b != 'true' && needs.build.outputs.scope != 'p2-edge'
    # Match the supported OS of pinned Playwright 1.56.1; latest may roll forward.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: ./.github/actions/setup-ceac-test-environment

      - name: Cache Playwright Chromium
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.55.0

      - name: Install Playwright runner
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Start local app
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/ceac-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/ceac-vite.log
          exit 1

      - name: Run affected Level A browser contract
        run: scripts/ci/run-level-a-browser.sh "${{ needs.build.outputs.scope }}"
