name: CEAC Stage 2 isolated full SQL security acceptance
on:
  push:
    branches:
      - chatgpt/stage2-integrated-qa-contract-20261016
    paths:
      - .github/workflows/stage2-isolated-sql.yml
permissions:
  contents: read
jobs:
  stage2-isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-ceac-test-environment
      - name: Run all registered RLS and SQL security tests with rollback fixtures
        run: bash scripts/ci/run-sql-security-gates.sh
