name: CEAC Stage 2 isolated universal TOTP server gate
on:
  push:
    branches:
      - chatgpt/stage2-universal-totp-server-guard-20261016
    paths:
      - .github/workflows/stage2-universal-totp-sql.yml
permissions:
  contents: read
jobs:
  reviewed-universal-aal2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ROLE_FIXTURE_PASSWORD: Local-role-fixture-2026!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:source
      - run: npm run build
      - uses: ./.github/actions/setup-ceac-test-environment
      - name: Full isolated SQL authority, all-role MFA and RLS replay
        run: bash scripts/ci/run-sql-security-gates.sh
# Retest the preserved S3 fingerprint with reviewed, explicit Stage 2 RLS helper.
